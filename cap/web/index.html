<style>
/* The menu is laid out on a fixed 400-unit-tall landscape canvas and scaled to the screen; on a
   portrait phone the whole thing is rotated so it is always sideways. The game stage works the same way.
   Look: dusk sky, chunky outlined art, sun-orange accents, gold for premium, sky-blue for classic. */
:root {
  --bg: #120d26;
  --surface: #1c1838;
  --raised: #2a2552;
  --line: #4a4388;
  --fg: #f6f4ff;
  --mute: #b0aad6;
  --sun: #ffb62e;
  --sky: #5cc8ff;
  --coral: #ff5d47;
  --mint: #35d6a4;
  --gold: #ffc94d;
  --font-display: 'Bungee', 'Arial Black', system-ui, sans-serif;
  --font-ui: 'Barlow Semi Condensed', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.3; overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
#ui { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #2a1a4a; }
#ui[hidden] { display: none; }
#pv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.abs { position: absolute; }
.panel-dark { background: rgba(18, 13, 38, 0.72); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; }
#prof { left: 12px; top: 10px; display: flex; gap: 8px; align-items: center; padding: 6px 12px 6px 6px; min-width: 130px; }
#prof .av { width: 38px; height: 44px; border-radius: 8px; background: rgba(255, 255, 255, 0.1); object-fit: contain; }
#prof b { display: block; font-size: 15px; }
#prof small { color: var(--mute); font-size: 12px; }
.xpbar { height: 6px; background: rgba(0, 0, 0, 0.4); border-radius: 9px; overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sun), var(--coral)); }
#gear { left: 164px; top: 14px; width: 36px; height: 36px; border-radius: 50%; font-size: 17px; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(18, 13, 38, 0.72); }
#logo { left: 50%; top: 4px; transform: translateX(-50%); text-align: center; pointer-events: none; }
#logo div { font-family: var(--font-display); font-size: 27px; line-height: 1; color: var(--sun); text-shadow: 0 2px 0 #7a2d10, 0 0 14px rgba(255, 140, 60, 0.6); letter-spacing: 0.02em; white-space: nowrap; }
#logo div i { font-style: normal; color: var(--sky); text-shadow: 0 2px 0 #12466a, 0 0 14px rgba(80, 200, 255, 0.5); }
#logo small { display: block; font-size: 11px; letter-spacing: 0.3em; color: var(--mute); margin-top: 2px; }
#wallet { right: 12px; top: 10px; display: flex; gap: 6px; align-items: center; }
.pill { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font-weight: 700; font-size: 15px; background: rgba(18, 13, 38, 0.75); border: 1px solid rgba(255, 255, 255, 0.16); min-width: 64px; }
.coin { width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1a8, #e9a81c 60%, #a8700c); border: 1px solid #5a3a06; flex: none; }
.gem { width: 13px; height: 13px; background: linear-gradient(135deg, #b8f1ff, #35b9ff 55%, #1f6fd0); transform: rotate(45deg); border: 1px solid #0c3a6a; border-radius: 2px; flex: none; margin: 0 1px; }
.plus { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--mint); color: #05281f; font-weight: 800; font-size: 17px; line-height: 1; padding: 0; }
.nav { display: flex; flex-direction: column; gap: 8px; top: 74px; }
.nav.l { left: 12px; }
.nav.r { right: 12px; }
.tile { width: 88px; height: 62px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); background: linear-gradient(180deg, rgba(60, 50, 120, 0.85), rgba(26, 20, 60, 0.9)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 14px; position: relative; padding: 0; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35); }
.tile:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.tile img { height: 28px; max-width: 70px; object-fit: contain; }
.tile .ico { height: 28px; display: flex; align-items: center; }
.badge { position: absolute; right: -4px; top: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box; }
.badge[hidden] { display: none; }
#plate { left: 50%; top: 292px; transform: translateX(-50%); text-align: center; pointer-events: none; }
#plate b { font-family: var(--font-display); font-weight: 400; font-size: 16px; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
#plate small { display: block; color: var(--mute); }
#crates { left: 12px; bottom: 10px; display: flex; gap: 6px; align-items: flex-end; }
#crates .lab { writing-mode: horizontal-tb; font-size: 11px; color: var(--mute); letter-spacing: 0.1em; text-transform: uppercase; position: absolute; top: -16px; left: 2px; }
.slot { width: 54px; height: 54px; border-radius: 10px; border: 2px dashed rgba(255, 255, 255, 0.22); background: rgba(18, 13, 38, 0.55); padding: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.slot.full { border: 2px solid var(--gold); background: radial-gradient(circle at 50% 30%, rgba(255, 201, 77, 0.35), rgba(18, 13, 38, 0.75)); animation: pulse 1.8s ease-in-out infinite; }
.slot.full.win { border-color: var(--mint); background: radial-gradient(circle at 50% 30%, rgba(53, 214, 164, 0.4), rgba(18, 13, 38, 0.75)); }
@keyframes pulse { 50% { box-shadow: 0 0 14px rgba(255, 201, 77, 0.7); } }
.more { align-self: center; font-weight: 800; color: var(--gold); font-size: 14px; padding-left: 2px; }
#loadout { left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 8px; }
.ld { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(18, 13, 38, 0.7); text-align: left; }
.ld img { width: 62px; height: 28px; object-fit: contain; }
.ld small { display: block; color: var(--mute); font-size: 11px; }
.ld b { font-size: 13px; }
#battle { right: 14px; bottom: 12px; width: 176px; height: 74px; border-radius: 16px; border: 3px solid #7a2d10; background: linear-gradient(180deg, #ffd45e, #ff9a2e 55%, #e8561c); color: #3a1200; font-family: var(--font-display); font-size: 30px; box-shadow: 0 5px 0 #7a2d10, 0 0 24px rgba(255, 140, 50, 0.5); letter-spacing: 0.03em; }
#battle:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a2d10; }
#battleSub { right: 14px; bottom: 90px; width: 176px; font-weight: 700; text-align: center; font-size: 12px; color: #ffe9c8; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); display: inline-block; }
.dot.on { background: var(--mint); }
#hint { left: 50%; top: 58px; transform: translateX(-50%); font-size: 13px; color: #ffe9c8; background: rgba(18, 13, 38, 0.7); padding: 3px 12px; border-radius: 99px; white-space: nowrap; }
#hint[hidden] { display: none; }
/* modal */
#modal { position: absolute; inset: 0; background: rgba(8, 5, 20, 0.7); display: flex; align-items: center; justify-content: center; z-index: 5; }
#modal[hidden] { display: none; }
.mod { width: min(96%, 700px); height: 356px; background: linear-gradient(180deg, #2a2456, #17122f); border: 2px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
.mod header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); gap: 8px; }
.mod h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 19px; color: var(--sun); }
.mod .mw { display: flex; gap: 6px; }
#mClose { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--coral); color: #fff; font-weight: 800; font-size: 16px; padding: 0; }
#mBody { flex: 1; min-height: 0; overflow: hidden; display: flex; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.scroll { overflow-y: auto; overscroll-behavior: contain; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 10px; }
.chip { font-weight: 700; font-size: 12px; background: rgba(0, 0, 0, 0.3); color: var(--mute); border: 1.5px solid var(--line); border-radius: 99px; padding: 3px 10px; }
.chip.on { background: var(--sun); color: #2b1c00; border-color: var(--sun); }
.chip.prem.on { background: var(--gold); }
.grid { display: grid; gap: 6px; padding: 6px 10px 10px; }
.card { background: rgba(0, 0, 0, 0.28); border: 2px solid var(--line); border-radius: 10px; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; text-align: center; min-width: 0; }
.card.prem { border-color: #a8832a; background: linear-gradient(180deg, rgba(255, 201, 77, 0.16), rgba(0, 0, 0, 0.3)); }
.card.sel { border-color: var(--sun); box-shadow: 0 0 0 2px rgba(255, 182, 46, 0.4); }
.card img { width: 100%; height: 46px; object-fit: contain; }
.card b { font-size: 11px; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card small { font-size: 11px; color: var(--mute); }
.tag { position: absolute; left: 3px; top: 3px; font-size: 9px; font-weight: 800; border-radius: 4px; padding: 0 4px; background: #25507a; color: #cfeaff; letter-spacing: 0.04em; }
.tag.p { background: #7a5a0c; color: #ffe9a0; }
.tag.o { background: #1c6a54; color: #c9ffe9; left: auto; right: 3px; top: auto; bottom: 28px; }
.detail { width: 200px; flex: none; border-left: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; gap: 6px; align-items: center; text-align: center; background: rgba(0, 0, 0, 0.18); }
.detail img { width: 100%; height: 90px; object-fit: contain; }
.detail h3 { margin: 0; font-size: 17px; }
.detail p { margin: 0; color: var(--mute); font-size: 12px; }
.sbar { width: 100%; display: grid; grid-template-columns: 44px 1fr; gap: 4px; align-items: center; font-size: 10px; color: var(--mute); text-align: left; letter-spacing: 0.06em; }
.sbar i { display: block; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.sbar i b { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), var(--mint)); }
.btn { font-family: var(--font-display); font-size: 13px; border: 0; border-radius: 10px; padding: 9px 14px; background: var(--sun); color: #2b1c00; letter-spacing: 0.02em; }
.btn.sky { background: var(--sky); color: #04283d; }
.btn.mint { background: var(--mint); color: #05281f; }
.btn.gold { background: linear-gradient(180deg, #ffe08a, #f0a81c); color: #3a2400; }
.btn.alt { background: var(--raised); color: var(--fg); border: 1px solid var(--line); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.wide { width: 100%; }
.pad { padding: 10px 14px; overflow-y: auto; flex: 1; }
.pad h4 { margin: 8px 0 4px; font-size: 13px; color: var(--sun); letter-spacing: 0.06em; text-transform: uppercase; }
.pad p, .pad li { color: var(--mute); margin: 3px 0; font-size: 13px; }
.pad ul { margin: 0; padding-left: 18px; }
input[type=text] { background: rgba(0, 0, 0, 0.35); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 15px; min-width: 0; box-sizing: border-box; }
.rowf { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.game { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 4px 0; }
.msg { color: var(--coral); font-size: 13px; min-height: 1em; }
.pack { display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.28); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 5px 0; justify-content: space-between; }
.pack b { font-size: 16px; display: flex; align-items: center; gap: 6px; }
/* crate opening */
.toast { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); background: rgba(18, 13, 38, 0.92); border: 1px solid var(--gold); color: #fff; border-radius: 99px; padding: 6px 16px; font-weight: 700; z-index: 12; white-space: nowrap; }
.toast[hidden] { display: none; }
/* game stage */
#game { position: fixed; inset: 0; background: #8fd3ff; overflow: hidden; z-index: 3; }
#game[hidden] { display: none; }
#game.rot { inset: auto; top: 0; transform-origin: 0 0; transform: rotate(90deg); z-index: 5; }
canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.ovl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; background: rgba(15, 10, 36, 0.35); }
.ovl[hidden] { display: none; }
.gpanel { background: rgba(18, 13, 38, 0.95); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; text-align: center; max-width: 440px; width: 100%; box-sizing: border-box; max-height: 100%; overflow-y: auto; }
.gpanel h3 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0; color: var(--sun); text-wrap: balance; }
.gpanel p { margin: 0; color: var(--mute); font-size: 13px; }
.gpanel .code { color: var(--sun); letter-spacing: 0.14em; }
.gpanel .chips { justify-content: center; padding: 2px; }
.gpanel .btn { padding: 9px 14px; }
.board { display: flex; flex-direction: column; gap: 3px; text-align: left; }
.board div { display: flex; justify-content: space-between; gap: 10px; background: var(--surface); border-radius: 8px; padding: 3px 10px; font-weight: 600; font-size: 13px; }
.board div span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rew { color: var(--gold); font-weight: 700; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .slot.full { animation: none; } }

/* campaign additions */
.gb { position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.55); background: rgba(18, 13, 38, 0.5); color: #fff; font-weight: 800; font-size: 11px; letter-spacing: 0.04em; padding: 0; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
.gb:active { background: rgba(255, 182, 46, 0.55); }
.gb[hidden] { display: none; }
.gb.big { background: rgba(255, 182, 46, 0.8); color: #2b1c00; border-color: #fff; font-size: 16px; animation: pulse 1.2s ease-in-out infinite; }
.gb.act { background: rgba(255, 140, 50, 0.75); }
.lvgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 6px 10px 10px; }
.lv { border: 2px solid var(--line); border-radius: 10px; background: rgba(0, 0, 0, 0.3); padding: 0; overflow: hidden; display: flex; flex-direction: column; text-align: center; min-width: 0; position: relative; }
.lv i { display: block; height: 14px; }
.lv b { font-family: var(--font-display); font-weight: 400; font-size: 17px; padding: 3px 0 0; }
.lv small { color: var(--mute); font-size: 11px; padding-bottom: 3px; }
.lv.boss { border-color: #ff5a46; background: rgba(120, 20, 20, 0.35); }
.lv.cur { border-color: var(--sun); box-shadow: 0 0 0 2px rgba(255, 182, 46, 0.5); }
.lv.done b { color: var(--mint); }
.lv.lock { opacity: 0.4; }
.up { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; background: rgba(0, 0, 0, 0.28); border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; margin: 5px 0; }
.up .ic { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1b1200; font-weight: 800; font-size: 14px; }
.up b { font-size: 15px; }
.up small { display: block; color: var(--mute); font-size: 12px; }
.up .bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; margin-top: 4px; }
.up .bar i { display: block; height: 100%; }
.pwr { display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 4px 0; }
.pwr .meter { flex: 1; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.12); position: relative; overflow: visible; }
.pwr .meter i { display: block; height: 100%; border-radius: 5px; }
.pwr .meter u { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #fff; border-radius: 2px; }
.adov { position: absolute; inset: 0; z-index: 30; background: rgba(8, 5, 20, 0.88); display: flex; align-items: center; justify-content: center; padding: 10px; }
.adbox { width: min(92%, 420px); background: #1c1838; border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
.adbox .screen { height: 110px; border-radius: 10px; background: repeating-linear-gradient(45deg, #2a2552, #2a2552 14px, #332d66 14px, #332d66 28px); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); color: var(--mute); font-size: 15px; }
.adbox .pb { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.adbox .pb i { display: block; height: 100%; width: 0; background: var(--mint); }
.adbox p { margin: 0; color: var(--mute); font-size: 12px; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 4px 0; }
.sw span { color: var(--fg); font-size: 14px; }
.sw small { display: block; color: var(--mute); font-size: 12px; }
.pill.on { border-color: var(--mint); }
.mult { font-family: var(--font-display); font-size: 26px; color: var(--sun); }


/* crate opening (canvas animated) */
#crateov { position: absolute; inset: 0; z-index: 8; background: radial-gradient(circle at 50% 42%, rgba(70, 45, 150, 1), rgba(6, 3, 16, 1)); overflow: hidden; }
#crateov[hidden] { display: none; }
#crc { position: absolute; inset: 0; width: 100%; height: 100%; }
#crateReward { position: absolute; left: 0; right: 0; top: 262px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
#crateReward.rev { top: 62px; }
#crateReward img { height: 104px; max-width: 240px; object-fit: contain; filter: drop-shadow(0 0 16px var(--rc, #ffd45e)); animation: pop 0.8s cubic-bezier(.2, 1.4, .4, 1) both; }
#crateReward h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--rc, #ffb62e); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); animation: rise 0.5s 0.35s ease-out both; }
#crateReward p { margin: 0; color: var(--mute); animation: rise 0.5s 0.5s ease-out both; }
#crateReward .big { font-family: var(--font-display); font-size: 46px; color: var(--rc); text-shadow: 0 3px 0 rgba(0, 0, 0, 0.6), 0 0 22px var(--rc); animation: pop 0.8s cubic-bezier(.2, 1.4, .4, 1) both; line-height: 1.1; }
#crateBtn { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); min-width: 140px; }
@keyframes pop { 0% { transform: scale(0.1) rotate(-25deg) translateY(50px); opacity: 0; } 55% { transform: scale(1.3) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes rise { 0% { transform: translateY(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes panelin { 0% { transform: scale(0.88) translateY(16px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.gpanel, .mod, .adbox { animation: panelin 0.28s cubic-bezier(.2, 1.2, .4, 1) both; }
@media (prefers-reduced-motion: reduce) { .gpanel, .mod, .adbox, #crateReward * { animation: none !important; } }
</style>
